<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <title>Full Page Background</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }

      body {
        background-image: url('mount.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #1d1b1b;
      }

      header {
        background-color: rgba(121, 116, 116, 0.6); /* Semi-transparent background for readability */
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome</h1>
    </header>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>

    <main>
      <!-- Paragraph with background image placed inside <body> -->
      <p class="bg-paragraph">
        This paragraph now has a visible background image!
      </p>
      <script src="main.js"></script>
    </main>
  </body>
</html>
